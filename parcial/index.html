<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Examen Parcial - EmailJS</title>
    <link rel="stylesheet" href="css.CSS" />
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  </head>
  <body>

    <div id="estado-conexion" class="estado online" role="status" aria-live="polite">
      <span class="estado-punto"></span>
      <span id="estado-texto">CONECTADO</span>
    </div>
 
    <main class="main-container">
      <div class="card">
        <h2>Formulario de contacto</h2>
        <p class="subtitulo">Escríbenos y te responderemos pronto</p>
 
        <form id="contact-form" onsubmit="enviarCorreo(event)">
          <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required />
          </div>
 
          <div class="form-group">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" required />
          </div>
 
          <div class="form-group">
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje..." required></textarea>
          </div>
 
          <button type="submit" id="btn-enviar">Enviar</button>
          <p id="aviso" class="aviso" hidden></p>
        </form>
      </div>
 
      <footer>
        <p>&copy; 2026 Mi sitio web. Todos los derechos reservados</p>
        <p>Diseñado por Karina</p>
        <nav>
          <a href="../index.html">inicio</a>
            <a href="../html5.html">-html5</a>
            <a href="../css.html">-css</a>
            <a href="../javascript.html">-JavaScript</a>
            <a href="../https://2511140382-cmyk.github.io/MiPortafolio/">-MiPortafolio</a>
            <a href="../javaScriptAsincrono.html">-JavaScript-Asincrónico</a>
        </nav>
      </footer>
    </main>
 
    <script src="script.js"></script>
  </body>
</html>
