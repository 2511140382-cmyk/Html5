<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="java.CSS">

    <!-- ensale al archivo JS -->
    <script src="script.js"></script>
</head>
<body>
    <h1 id="titulo">Ruth Karina</h1>

    <button id="btnCambiar">Cambiar texto</button>
    <br><br>
    <ul id="lista"></ul>
    <button id="btnAgregar">Agregar elemento</button>
    <button id="btn">Haz clic aquí</button>
    <br><br>
    <h1>Presiona una tecla</h1>
    <p id="resultado"></p>

    <form id="formulario">
        <input id="nombre" type="text" />
        <button type="submit">Guardar</button>
    </form>
    <p id="datoGuardado"></p>

    <script>
        function Alerta(mensaje) {
        alert(mensaje);
    }
    const titulo = document.getElementById("titulo");

    titulo.style.color = "black";
    titulo.style.fontSize = "20px";

    const botonCambiar = document.getElementById("btnCambiar");

    botonCambiar.addEventListener("click", function() {

        titulo.textContent = "Bienvenido a mi sitio web";
        titulo.style.color = "purple";
        titulo.style.fontSize = "30px";

    });

    const lista = document.getElementById("lista");
    const botonAgregar = document.getElementById("btnAgregar");

    botonAgregar.addEventListener("click", function() {

        const li = document.createElement("li");

        li.textContent = "Ingeniera de Sistemas";

        lista.appendChild(li);

    });

    const botonMensaje = document.getElementById("btn");

    botonMensaje.addEventListener("click", function() {

        console.log("Se hizo clic");
        alert("¡Bienvenido!");

    });
    const resultado = document.getElementById("resultado");
    document.addEventListener("keydown", (evento) => {
    console.log("Tecla:", evento.key); 
    alert("Tecla presionada!");
    resultado.textContent = "Presionaste: " + evento.key; 
    });

    const formulario = document.getElementById("formulario");
    formulario.addEventListener("submit", (evento) => {
    evento.preventDefault(); 
    const nombre = document.getElementById("nombre").value; 
    alert("Dato guardado!");
    console.log("Nombre:", nombre);
    document.getElementById("datoGuardado").textContent = "Dato guardado: " + nombre;
    });
    </script>
       
</body>
</html>
